<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title description">
<title id="title">EII — domains, candidate sources and research views</title>
<desc id="description">Fifteen established scientific domains. GISDS and OSDS are distinct candidate source catalogues. Developing Database Reference Methodology relationships are conceptual, not verified source-to-indicator bindings or operational federation. The Scientific Reference Register is a human presentation of the authoritative JSON records, not a source provider.</desc>
