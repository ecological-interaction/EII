<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title description">
<title id="title">EII — indicator domains and reference views</title>
<desc id="description">The authoritative Machine Reference contains 235 indicators classified in EII Domain Taxonomy v1.0.0, D01 through D15. One primary domain is assigned to each indicator; secondary-domain relationships are preserved. A scientific presentation contains 235 indicators and a separately curated remote-sensing subset contains 91. Source routes are candidates, not bound observations; the inventory is not a validated monitoring standard.</desc>
